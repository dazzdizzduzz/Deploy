components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: |
                JSON Web Token yang memuat klaim:
                - `sub`: User ID
                - `tid`: Tenant ID
                - `role`: Peran pengguna (`super_admin`, `owner`, `hrd`, `team_lead`, `employee`, `cashier`)
                - `eid`: Employee ID
    responses:
        UnauthorizedError:
            description: Autentikasi gagal atau token tidak disertakan
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
        ForbiddenError:
            description: Tidak memiliki hak akses untuk tindakan ini
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
        NotFoundError:
            description: Data tidak ditemukan pada tenant ini
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
        ValidationError:
            description: Data input tidak valid (RFC 7807)
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/ProblemDetails'
    schemas:
        # ------------------------------------------
        # RFC 7807 PROBLEM DETAILS
        # ------------------------------------------
        ProblemDetails:
            type: object
            required:
                - type
                - title
                - status
            properties:
                type:
                    type: string
                    example: https://ontrack.app/problems/validation-error
                title:
                    type: string
                    example: Data yang dimasukkan tidak valid
                status:
                    type: integer
                    example: 422
                detail:
                    type: string
                    example: Format email atau field wajib belum diisi dengan benar.
                code:
                    type: string
                    example: VALIDATION_ERROR
                errors:
                    type: object
                    additionalProperties:
                        type: string
                    example:
                        email: Format email tidak valid
                        name: Nama wajib diisi
        PaginationMeta:
            type: object
            required:
                - page
                - per_page
                - total
                - total_pages
            properties:
                page:
                    type: integer
                    example: 1
                per_page:
                    type: integer
                    example: 20
                total:
                    type: integer
                    example: 6
                total_pages:
                    type: integer
                    example: 1
        # ------------------------------------------
        # AUTH SCHEMAS
        # ------------------------------------------
        LoginRequest:
            type: object
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    example: daze@studiotigapagi.com
                password:
                    type: string
                    format: password
                    example: Demo1234
                remember_me:
                    type: boolean
                    default: false
        AuthTokens:
            type: object
            required:
                - access_token
                - refresh_token
                - token_type
                - expires_in
            properties:
                access_token:
                    type: string
                    example: eyJhbGciOi...
                refresh_token:
                    type: string
                    example: def502...
                token_type:
                    type: string
                    example: Bearer
                expires_in:
                    type: integer
                    description: Masa berlaku access token dalam detik (900 detik / 15 menit)
                    example: 900
        LoginResponse:
            type: object
            required:
