        get:
            tags:
                - Absensi Harian (F03, F04)
            summary: Status absensi hari ini pengguna saat ini
            description: Mengembalikan status (not_clocked_in, clocked_in, clocked_out), jadwal hari ini, lokasi kantor, dan ringkasan bulan ini.
            responses:
                '200':
                    description: Status absensi hari ini berhasil diambil
            x-rbac:
                - super_admin
                - owner
                - hrd
                - team_lead
                - employee
                - cashier
    /attendance/clock-in:
        post:
            tags:
                - Absensi Harian (F03, F04)
            summary: Clock-in kehadiran masuk kerja
            description: |
                Mencatat waktu kehadiran masuk kerja dengan validasi:
                - Akurasi GPS maksimal ±50 m (melebihi ini tolak 422 GPS_WEAK).
                - Mock location dilarang (tolak 422 MOCK_LOCATION_DETECTED).
                - Jarak dihitung rumus Haversine ke titik kantor (di luar radius tolak 422 OUTSIDE_GEOFENCE).
                - Status 'hadir' jika dalam jam masuk + toleransi jadwal; status 'terlambat' jika melebihi toleransi.
                - Hanya 1 clock-in per hari kerja (clock-in kedua tolak 409 ALREADY_CLOCKED_IN).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClockInRequest'
            responses:
                '200':
                    description: Clock-in berhasil dicatat
                '409':
                    description: Sudah melakukan clock-in hari ini
                '422':
                    description: Validasi GPS, geofence, atau lokasi palsu gagal
            x-rbac:
                - super_admin
                - owner
                - hrd
                - team_lead
                - employee
                - cashier
    /attendance/clock-out:
        post:
            tags:
                - Absensi Harian (F03, F04)
            summary: Clock-out kehadiran pulang kerja
            description: |
                Mencatat waktu pulang kerja:
                - Pulang sebelum jam jadwal wajib mengisi catatan early_leave_note (maks 200 karakter).
                - Clock-out lebih dari 30 menit setelah jam pulang otomatis membuat pengajuan lembur (overtime request).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ClockOutRequest'
            responses:
                '200':
                    description: Clock-out berhasil dicatat
                '409':
                    description: Sudah melakukan clock-out hari ini
                '422':
                    description: Belum clock-in atau catatan pulang cepat kosong
            x-rbac:
                - super_admin
                - owner
                - hrd
                - team_lead
                - employee
                - cashier
