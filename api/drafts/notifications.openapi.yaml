# DRAF USULAN dari tim frontend untuk ISSUE-45-FE · belum diimplementasikan backend.
# Kontrak utama belum punya endpoint notifikasi. Draf ini mencakup notifikasi in-app dan pendaftaran
# token perangkat untuk push (FCM di Android, APNs di iOS). Acuan backend: ISSUE-81-BE (dispatcher &
# handler notifikasi) dan ISSUE-82-BE (tabel notifications). Setelah disetujui, pindahkan ke kontrak
# utama dan hapus file ini.
#
# Alur push: saat pengajuan izin disetujui/ditolak (POST /leave-requests/{id}/approve|reject),
# server menyimpan satu baris `notifications` untuk karyawan pemilik pengajuan, lalu mengirim push
# ke semua token perangkat milik user itu. Payload `data` push wajib berisi field di
# PushData agar tap notifikasi membuka layar yang benar.
openapi: 3.0.3
info:
  title: On-Track API · draf notifikasi
  version: 0.1.0-draft
paths:
  /me/notifications:
    get:
      summary: Notifikasi milik pengguna yang login, terbaru lebih dulu
      operationId: listMyNotifications
      security:
        - BearerAuth: []
      x-rbac: [owner, hrd, team_lead, employee, cashier]
      parameters:
        - name: unread
          in: query
          description: true hanya mengembalikan yang belum dibaca
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Daftar notifikasi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, unread_count]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  unread_count:
                    type: integer
                    description: Total belum dibaca (tanpa filter halaman), untuk badge
  /me/notifications/unread-count:
    get:
      summary: Jumlah notifikasi belum dibaca (ringan, dipanggil saat aplikasi aktif kembali)
      operationId: getMyUnreadNotificationCount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Jumlah belum dibaca
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer }
  /me/notifications/{id}/read:
    post:
      summary: Tandai satu notifikasi sudah dibaca (idempoten)
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Ditandai sudah dibaca
        '404':
          description: Tidak ditemukan atau milik pengguna lain
  /me/notifications/read-all:
    post:
      summary: Tandai semua notifikasi sudah dibaca
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Semua ditandai sudah dibaca
  /me/devices:
    post:
      summary: Daftarkan token push perangkat (upsert berdasarkan token)
      description: |
        Dipanggil setelah login dan setiap kali token perangkat berubah. Token yang sama dari user lain
        dipindahkan ke user ini (perangkat berganti akun). Token yang ditolak FCM/APNs sebagai tidak
        valid dihapus server.
      operationId: registerMyDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  maxLength: 4096
                  description: Token FCM (Android) atau APNs (iOS) dari perangkat
                platform:
                  type: string
                  enum: [android, ios]
                device_name:
                  type: string
                  maxLength: 100
                  example: Pixel 8
      responses:
        '204':
          description: Token tersimpan
  /me/devices/unregister:
    post:
      summary: Hapus token push saat logout
      description: Dikirim sebelum token akses dibuang, agar perangkat berhenti menerima push akun ini.
      operationId: unregisterMyDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
      responses:
        '204':
          description: Token dihapus (juga bila token tidak dikenal)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NotificationType:
      type: string
      description: Jenis lain (tugas, lembur, payroll) ditambahkan oleh ticket fitur masing-masing.
      enum: [leave_approved, leave_rejected]
    Notification:
      type: object
      required: [id, type, title, body, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: Pengajuan cuti disetujui
        body:
          type: string
          example: Cuti tahunan 16–18 Nov 2026 disetujui oleh Rina (HRD).
        leave_request_id:
          type: string
          format: uuid
          nullable: true
          description: Diisi untuk jenis leave_*; membuka Detail Pengajuan saat di-tap
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PushData:
      description: Isi `data` pada pesan push (semua nilai string, batasan FCM)
      type: object
      required: [notification_id, type]
      properties:
        notification_id: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/NotificationType'
        leave_request_id: { type: string, format: uuid }
    PaginationMeta:
      description: Sama dengan PaginationMeta di api/openapi-phase1.yaml
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
