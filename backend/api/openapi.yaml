openapi: "3.0.3"
info:
  title: OnTrack API
  description: API server untuk aplikasi OnTrack (Autentikasi, Lokasi Kantor & Jadwal Kerja)
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      summary: Login user dan dapatkan token JWT
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil, mengembalikan token JWT RS256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Kredensial tidak valid (email atau password salah)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Akun terkunci sementara karena batas percobaan login tercapai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: Logout user
      operationId: postAuthLogout
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/password/forgot:
    post:
      summary: Minta tautan/token reset kata sandi
      operationId: postAuthPasswordForgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Permintaan diterima (tidak memvalidasi secara publik apakah email terdaftar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Format email tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/reset:
    post:
      summary: Reset kata sandi menggunakan token
      operationId: postAuthPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Kata sandi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token tidak valid, kedaluwarsa, atau input tidak lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations:
    get:
      summary: Daftar lokasi kantor tenant
      operationId: getLocations
      responses:
        "200":
          description: Daftar lokasi kantor berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationsListResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Tambah lokasi kantor baru (FR-05)
      operationId: postLocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: Lokasi berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Radius lokasi di luar 25-500 m atau validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik lokasi kantor (UUID)
        schema:
          type: string
          format: uuid
    get:
      summary: Detail lokasi kantor
      operationId: getLocationById
      responses:
        "200":
          description: Detail lokasi kantor berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationResponse"
        "404":
          description: Lokasi kantor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Perbarui lokasi kantor (FR-05)
      operationId: putLocationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Lokasi kantor berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lokasi kantor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Radius lokasi di luar 25-500 m atau validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Perbarui sebagian lokasi kantor (FR-05)
      operationId: patchLocationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Lokasi kantor berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeLocationResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lokasi kantor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Radius lokasi di luar 25-500 m atau validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Hapus lokasi kantor
      operationId: deleteLocationById
      responses:
        "200":
          description: Lokasi kantor berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Lokasi kantor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedules:
    get:
      summary: Daftar jadwal kerja tenant
      operationId: getSchedules
      responses:
        "200":
          description: Daftar jadwal kerja berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSchedulesListResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Tambah jadwal kerja baru
      operationId: postSchedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Jadwal berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validasi format jam kerja gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID unik jadwal kerja (UUID)
        schema:
          type: string
          format: uuid
    get:
      summary: Detail jadwal kerja
      operationId: getScheduleById
      responses:
        "200":
          description: Detail jadwal kerja berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleResponse"
        "404":
          description: Jadwal kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Perbarui seluruh data jadwal kerja
      operationId: putScheduleById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Jadwal kerja berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Jadwal kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validasi format jam kerja gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Perbarui sebagian data jadwal kerja
      operationId: patchScheduleById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Jadwal kerja berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkScheduleResponse"
        "400":
          description: Format request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Jadwal kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validasi format jam kerja gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Hapus jadwal kerja
      operationId: deleteScheduleById
      responses:
        "200":
          description: Jadwal kerja berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Jadwal kerja tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendances/clock-in:
    post:
      summary: Clock-in karyawan dengan GPS geofence dan selfie
      description: |
        ISSUE-62 (FR-06, FR-08, FR-09). `tenant_id` dan `user_id` diambil dari klaim JWT
        (`tid`, `sub`), tidak pernah dikirim klien.
        - Mode `office`: server memilih lokasi kantor aktif terdekat lalu memeriksa radius geofence.
          Di luar radius dijawab 422.
        - Mode `wfh` / `business_trip`: hanya bila jadwal kerja mengizinkan (`allow_remote`).
        - Selfie wajib bila lokasi kantor mengatur `selfie_required`. JPEG/PNG, maksimal 2 MB,
          disimpan privat di object storage dengan path `{tenant_id}/selfie/{nama}`.
        - Status `on_time` / `late` dihitung dari jam mulai + toleransi jadwal, di zona waktu tenant.
      operationId: postAttendanceClockIn
      x-rbac: [owner, hrd, team_lead, employee, cashier]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClockInRequest"
      responses:
        "201":
          description: Clock-in tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "400":
          description: Input tidak valid (koordinat, mode kerja, atau work_schedule_id)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Token tidak ada, tidak valid, atau kedaluwarsa
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang atau akun tidak terikat ke tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Sudah clock-in pada tanggal kerja ini
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Foto selfie lebih dari 2 MB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Foto selfie bukan JPEG atau PNG
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Di luar geofence, selfie wajib tidak dikirim, mode remote tidak diizinkan, atau jadwal/lokasi belum diatur
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Object storage tidak dapat diakses
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /attendances/clock-out:
    post:
      summary: Clock-out karyawan dan hitung pulang cepat / lembur
      description: |
        ISSUE-64 (FR-07, FR-08). Menutup presensi hari ini milik pengguna yang login.
        Mode `office` wajib berada di radius lokasi kantor yang sama dengan saat clock-in.
        Server menghitung `early_leave_minutes` atau `overtime_minutes` dari jadwal kerja.
        Clock-out hanya boleh sekali.
      operationId: postAttendanceClockOut
      x-rbac: [owner, hrd, team_lead, employee, cashier]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClockOutRequest"
      responses:
        "200":
          description: Clock-out tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "400":
          description: Input tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Token tidak ada, tidak valid, atau kedaluwarsa
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang atau akun tidak terikat ke tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Belum clock-in pada tanggal kerja ini
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Sudah clock-out
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Foto selfie lebih dari 2 MB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Foto selfie bukan JPEG atau PNG
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Di luar geofence atau selfie wajib tidak dikirim
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Object storage tidak dapat diakses
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /overtime-requests:
    get:
      summary: Daftar pengajuan lembur tenant
      description: |
        ISSUE-66 (FR-07, FR-09). Team Lead hanya melihat pengajuan dari anggota timnya.
        Owner/HRD melihat seluruh pengajuan lembur di tenant.
      operationId: getOvertimeRequests
      x-rbac: [super_admin, owner, hrd, team_lead]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [menunggu, disetujui, ditolak]
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Daftar pengajuan lembur dan jumlah per status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      summary: Pengajuan lembur mandiri oleh karyawan
      description: |
        ISSUE-66 (FR-07, FR-09). Karyawan mengajukan lembur dengan tanggal, jam mulai, jam selesai,
        dan alasan lembur.
      operationId: postOvertimeRequest
      x-rbac: [owner, hrd, team_lead, employee, cashier]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOvertimeRequest"
      responses:
        "201":
          description: Pengajuan lembur berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeResponse"
        "400":
          description: Input tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /overtime-requests/{id}:
    get:
      summary: Detail pengajuan lembur
      operationId: getOvertimeRequestById
      x-rbac: [super_admin, owner, hrd, team_lead, employee, cashier]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail pengajuan lembur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Pengajuan lembur tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /overtime-requests/{id}/approve:
    post:
      summary: Setujui pengajuan lembur (Team Lead/HRD/Owner)
      operationId: postOvertimeRequestApprove
      x-rbac: [super_admin, owner, hrd, team_lead]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pengajuan lembur berhasil disetujui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeResponse"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Karyawan tidak boleh menyetujui lembur sendiri atau peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Pengajuan lembur tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Pengajuan sudah diputuskan sebelumnya
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /overtime-requests/{id}/reject:
    post:
      summary: Tolak pengajuan lembur (Team Lead/HRD/Owner)
      operationId: postOvertimeRequestReject
      x-rbac: [super_admin, owner, hrd, team_lead]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Pengajuan lembur berhasil ditolak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OvertimeResponse"
        "400":
          description: Alasan penolakan tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Karyawan tidak boleh menolak lembur sendiri atau peran tidak berwenang
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Pengajuan lembur tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Pengajuan sudah diputuskan sebelumnya
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /users:
    get:
      summary: Daftar karyawan tenant
      description: |
        ISSUE-26, FR-03 (acuan api/openapi-phase1.yaml). Filter status, departemen, peran, dan
        pencarian nama/email. Field gaji pokok dan rekening bank hanya disertakan untuk peran
        `owner` dan `hrd`.
      operationId: getUsers
      x-rbac: [super_admin, owner, hrd, team_lead]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [aktif, nonaktif, diundang]
        - name: department_id
          in: query
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, hrd, team_lead, employee, cashier]
        - name: search
          in: query
          description: Pencarian nama atau email
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Daftar karyawan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          description: Parameter tidak valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang
          content:
            application/problem+json:
              schema:
