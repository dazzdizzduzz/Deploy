          type: string
          format: date
          example: "2026-11-13"
        start_time:
          type: string
          example: "17:30"
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
        end_time:
          type: string
          example: "19:30"
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: "Menyelesaikan revisi desain branding klien"

