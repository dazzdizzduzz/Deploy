  /me/leave-requests/attachments:
    post:
      summary: Unggah lampiran pengajuan izin (contoh surat dokter)
      description: |
        ISSUE-69 (FR-10), dari draf api/drafts/leave-requests.openapi.yaml. Dipanggil sebelum
        POST /me/leave-requests; nilai `attachment_url` di respons dikirim apa adanya di body
        pengajuan. Berkas disimpan privat di object storage dengan path
        `{tenant_id}/leave/{nama}`. JPG, PNG, atau PDF, maksimal 5 MB; tipe ditentukan dari isi
        berkas, bukan nama berkas.
      operationId: uploadLeaveAttachment
      x-rbac: [owner, hrd, team_lead, employee, cashier]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPG, PNG, atau PDF, maksimal 5 MB
      responses:
        "201":
          description: Berkas tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveAttachment"
        "400":
          description: Bukan multipart/form-data atau field file tidak ada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak terautentikasi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Peran tidak berwenang atau akun tidak terikat ke tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Berkas lebih dari 5 MB (code ATTACHMENT_TOO_LARGE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Format selain JPG, PNG, atau PDF (code ATTACHMENT_UNSUPPORTED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Object storage tidak dapat diakses
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "ok"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "employee@ontrack.id"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: RS256 signed JWT token
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Masa berlaku token dalam detik (15 menit = 900)
          example: 900

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "employee@ontrack.id"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          example: "a1b2c3d4e5f6..."
        new_password:
          type: string
          example: "newpassword123"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Invalid credentials"

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Operation successful"

    # ================= Lokasi Kantor (FR-05) Schemas =================
    CreateLocationRequest:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
        - radius_meters
      properties:
        name:
          type: string
          example: "Kantor Pusat Jakarta"
        address:
          type: string
          example: "Jl. Jenderal Sudirman No. 10, Jakarta"
        latitude:
          type: number
          format: double
          example: -6.2088
        longitude:
          type: number
          format: double
          example: 106.8456
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 100
        selfie_required:
          type: boolean
          default: false
          example: false

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
          example: "Kantor Pusat Jakarta (Gedung B)"
        address:
          type: string
          example: "Jl. Jenderal Sudirman No. 12, Jakarta"
        latitude:
          type: number
          format: double
          example: -6.2088
        longitude:
          type: number
          format: double
          example: 106.8456
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 150
        selfie_required:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true

    OfficeLocationResponse:
      type: object
      required:
        - id
        - tenant_id
        - name
        - address
        - latitude
        - longitude
        - radius_meters
        - selfie_required
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius_meters:
          type: integer
        selfie_required:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    OfficeLocationsListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OfficeLocationResponse"

    # ================= Jadwal Kerja Schemas =================
    CreateScheduleRequest:
      type: object
      required:
        - name
        - start_time
        - end_time
      properties:
        name:
          type: string
          example: "Shift Pagi Reguler"
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "17:00"
        tolerance_minutes:
          type: integer
          default: 15
          example: 15
        overtime_after_minutes:
          type: integer
          default: 60
          example: 60
        max_overtime_minutes:
          type: integer
          default: 180
          example: 180
        working_days:
          type: string
          default: "Sen,Sel,Rab,Kam,Jum"
          example: "Sen,Sel,Rab,Kam,Jum"
        allow_remote:
          type: boolean
          default: false
          example: false

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
          example: "Shift Pagi Fleksibel"
        start_time:
          type: string
          example: "08:30"
        end_time:
          type: string
          example: "17:30"
        tolerance_minutes:
          type: integer
          example: 20
        overtime_after_minutes:
          type: integer
          example: 45
        max_overtime_minutes:
          type: integer
          example: 120
        working_days:
          type: string
          example: "Sen,Sel,Rab,Kam,Jum,Sab"
        allow_remote:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true

    WorkScheduleResponse:
      type: object
      required:
        - id
        - tenant_id
        - name
        - start_time
        - end_time
        - tolerance_minutes
        - overtime_after_minutes
        - max_overtime_minutes
        - working_days
        - allow_remote
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "17:00"
        tolerance_minutes:
          type: integer
        overtime_after_minutes:
          type: integer
        max_overtime_minutes:
          type: integer
        working_days:
          type: string
        allow_remote:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string

    WorkSchedulesListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkScheduleResponse"

    Problem:
      type: object
      description: Format error RFC 7807 (application/problem+json).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: "https://ontrack.app/problems/OUTSIDE_GEOFENCE"
        title:
          type: string
          example: "Di luar area kantor"
        status:
          type: integer
          example: 422
        detail:
          type: string
        code:
          type: string
          example: "OUTSIDE_GEOFENCE"
        errors:
          type: object
          additionalProperties: true

    ClockInRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -8.685
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 115.262
        work_mode:
          type: string
          enum: [office, wfh, business_trip]
          default: office
        work_schedule_id:
          type: string
          format: uuid
          description: Wajib bila tenant punya lebih dari satu jadwal kerja aktif.
        selfie:
          type: string
          format: binary
          description: JPEG atau PNG, maksimal 2 MB. Wajib bila lokasi kantor mengatur selfie_required.

    ClockOutRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        selfie:
          type: string
          format: binary
          description: JPEG atau PNG, maksimal 2 MB. Wajib bila lokasi kantor mengatur selfie_required.

    AttendanceResponse:
      type: object
      required:
        - id
        - work_date
        - work_mode
        - clock_in
        - latitude_in
        - longitude_in
        - status
        - late_minutes
        - early_leave_minutes
        - overtime_minutes
        - has_selfie_in
        - has_selfie_out
      properties:
        id:
          type: string
          format: uuid
        office_location_id:
          type: string
          format: uuid
          nullable: true
        work_schedule_id:
          type: string
          format: uuid
          nullable: true
        work_date:
          type: string
          format: date
          description: Tanggal kerja menurut zona waktu tenant.
        work_mode:
          type: string
          enum: [office, wfh, business_trip]
        clock_in:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        clock_out:
          type: string
          format: date-time
          nullable: true
        latitude_in:
          type: number
          format: double
        longitude_in:
          type: number
          format: double
        latitude_out:
          type: number
          format: double
          nullable: true
        longitude_out:
          type: number
          format: double
          nullable: true
        distance_in_meters:
          type: integer
          nullable: true
        distance_out_meters:
          type: integer
          nullable: true
        status:
          type: string
          enum: [on_time, late, absent]
        late_minutes:
          type: integer
        early_leave_minutes:
          type: integer
        overtime_minutes:
          type: integer
        has_selfie_in:
          type: boolean
          description: Selfie disimpan privat; path storage tidak dikirim ke klien.
        has_selfie_out:
          type: boolean

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
